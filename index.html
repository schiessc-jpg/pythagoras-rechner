<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152b49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Pythagoras"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Pythagoras Rechner</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#172b47;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:520px;margin:auto;padding:24px 18px 50px}header{background:#152b49;color:white;padding:28px 20px;border-radius:20px}h1{font-size:28px;margin:0 0 8px}header p{margin:0;color:#cbd8ea}.panel{background:white;padding:22px;margin-top:18px;border-radius:18px;box-shadow:0 4px 24px #14294a0d}h2{font-size:18px;margin:0 0 16px}svg{width:100%;max-height:230px}label{display:block;font-weight:650;margin:15px 0 7px}input,select{width:100%;padding:14px;font-size:18px;border:1px solid #c7d2e0;border-radius:12px;background:#fff;color:#172b47}input:focus,select:focus{outline:3px solid #b5d6ff;border-color:#337bda}button{width:100%;padding:15px;border:0;border-radius:12px;background:#2169c9;color:white;font-size:17px;font-weight:700;margin-top:20px;cursor:pointer}.result{margin-top:17px;background:#eaf4ff;border-radius:12px;padding:16px;min-height:68px}.result strong{font-size:25px;overflow-wrap:anywhere}.error{background:#fff0ee;color:#a12824}.hint{color:#53667d;font-size:14px;line-height:1.5}footer{text-align:center;color:#6b7c90;font-size:13px;margin-top:20px}</style></head><body><main class="wrap"><header><h1>📐 Pythagoras</h1><p>Berechne die fehlende Seite eines rechtwinkligen Dreiecks.</p></header><section class="panel"><svg viewBox="0 0 360 225" role="img" aria-label="Rechtwinkliges Dreieck mit Katheten a und b und Hypotenuse c"><path d="M55 180 L55 30 L300 180 Z" fill="#e6f1ff" stroke="#2169c9" stroke-width="4" stroke-linejoin="round"/><path d="M55 157 H78 V180" fill="none" stroke="#2169c9" stroke-width="2"/><text x="32" y="108" font-size="20" fill="#172b47">a</text><text x="172" y="208" font-size="20" fill="#172b47">b</text><text x="186" y="91" font-size="20" fill="#172b47">c</text></svg><p class="hint">a und b sind die Katheten, c ist die Hypotenuse (die längste Seite).</p></section><section class="panel"><h2>Was möchtest du berechnen?</h2><label for="target">Gesuchte Seite</label><select id="target"><option value="c">Hypotenuse c</option><option value="a">Kathete a</option><option value="b">Kathete b</option></select><label for="first" id="firstLabel">Kathete a</label><input id="first" inputmode="decimal" type="text" placeholder="z. B. 3" autocomplete="off"><label for="second" id="secondLabel">Kathete b</label><input id="second" inputmode="decimal" type="text" placeholder="z. B. 4" autocomplete="off"><button id="calculate">Berechnen</button><div class="result" id="result" aria-live="polite">Gib zwei Seitenlängen ein.</div></section><footer>Funktioniert auch offline, sobald die App geladen wurde.</footer></main><script>const target=document.getElementById('target'),first=document.getElementById('first'),second=document.getElementById('second'),result=document.getElementById('result');const labels={a:'Kathete a',b:'Kathete b',c:'Hypotenuse c'};function update(){let fields=target.value==='c'?['a','b']:target.value==='a'?['b','c']:['a','c'];document.getElementById('firstLabel').textContent=labels[fields[0]];document.getElementById('secondLabel').textContent=labels[fields[1]];first.value='';second.value='';result.className='result';result.textContent='Gib zwei Seitenlängen ein.'}function calculate(){let x=Number(first.value.trim().replace(',','.')),y=Number(second.value.trim().replace(',','.'));let valid=s=>s.trim()!==''&&Number.isFinite(Number(s.trim().replace(',','.')));if(!valid(first.value)||!valid(second.value)||x<=0||y<=0){show('Bitte zwei gültige positive Zahlen eingeben.',true);return}let value;if(target.value==='c')value=Math.hypot(x,y);else{if(y<=x){show('Die Hypotenuse c muss länger als jede Kathete sein.',true);return}value=Math.sqrt((y-x)*(y+x))}if(!Number.isFinite(value)||value<=0){show('Mit diesen Werten ist keine Berechnung möglich.',true);return}let formatted=new Intl.NumberFormat('de-DE',{maximumFractionDigits:6}).format(value);result.className='result';result.innerHTML='<span>Ergebnis für '+labels[target.value]+':</span><br><strong>'+formatted+'</strong>'}function show(s,error){result.className='result'+(error?' error':'');result.textContent=s}target.addEventListener('change',update);document.getElementById('calculate').addEventListener('click',calculate);[first,second].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')calculate()}));if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
